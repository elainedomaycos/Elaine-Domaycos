<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #d2cdb7 0%, #c5bfa8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: #0f0d0e;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .auth-header p {
            color: #666;
            font-size: 14px;
        }

        .auth-logo {
            font-size: 48px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #d2cdb7 0%, #c5bfa8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #0f0d0e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #f9f9f9;
            color: #0f0d0e;
        }

        .form-group input:focus {
            outline: none;
            background: white;
            border-color: #0f0d0e;
            box-shadow: 0 0 8px rgba(15, 13, 14, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #0f0d0e;
            color: white;
            margin-bottom: 12px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2a2728;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 13, 14, 0.2);
        }

        .btn-secondary {
            background: #d2cdb7;
            color: #0f0d0e;
            border: 2px solid #0f0d0e;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #c5bfa8;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .auth-toggle button {
            background: none;
            border: none;
            color: #0f0d0e;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            font-family: 'Poppins', sans-serif;
        }

        .status-message {
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .status-message.success {
            background: #d3f9d8;
            color: #2f9e44;
            border: 1px solid #51cf66;
            display: block;
        }

        .status-message.error {
            background: #ffe0e0;
            color: #c92a2a;
            border: 1px solid #ff8787;
            display: block;
        }

        .status-message.info {
            background: #e0f7ff;
            color: #0066cc;
            border: 1px solid #66d9ff;
            display: block;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading-spinner.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #0f0d0e;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #cms-container {
            display: none;
        }

        #cms-container.visible {
            display: block;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 20px;
            }

            .auth-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Section -->
    <div id="auth-section" class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">⚙️</div>
            <h1>Portfolio Admin</h1>
            <p>Edit your portfolio content</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <form id="authForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="authBtn">Sign In</button>
        </form>

        <div class="auth-toggle">
            <span id="toggleText">Don't have an account?</span>
            <button type="button" onclick="toggleAuthMode()">
                <span id="toggleLink">Sign Up</span>
            </button>
        </div>
    </div>

    <!-- CMS Section (hidden until authenticated) -->
    <div id="cms-container">
        <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
        <iframe id="cmsFrame" style="width: 100%; height: 100vh; border: none;"></iframe>
    </div>

    <script src="admin-auth.js"></script>
</body>
</html>
