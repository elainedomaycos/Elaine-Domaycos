<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio CMS - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #d2cdb7;
            color: #0f0d0e;
            min-height: 100vh;
            padding: 20px;
        }

        .cms-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .cms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .cms-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f0d0e;
        }

        .cms-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: #0f0d0e;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2a2728;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #d2cdb7;
            color: #0f0d0e;
            border: 2px solid #0f0d0e;
        }

        .btn-secondary:hover {
            background: #c5bfa8;
        }

        .btn-danger {
            background: #ff6b6b;
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-success {
            background: #51cf66;
            color: #fff;
        }

        .btn-success:hover {
            background: #40c057;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #0f0d0e;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #0f0d0e;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .tab-btn.active {
            color: #0f0d0e;
            border-bottom-color: #0f0d0e;
            opacity: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #fff;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-section h3 {
            margin-bottom: 20px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0f0d0e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #0f0d0e;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            color: #0f0d0e;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            background: #fff;
            border-color: #0f0d0e;
            box-shadow: 0 0 8px rgba(15, 13, 14, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .items-list {
            display: grid;
            gap: 15px;
        }

        .item-card {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: start;
        }

        .item-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-title {
            font-weight: 700;
            font-size: 16px;
            color: #0f0d0e;
        }

        .item-desc {
            color: #666;
            font-size: 13px;
        }

        .item-actions {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .add-new-btn {
            margin-top: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #0f0d0e;
        }

        .modal-close {
            background: none;
            border: none;
            color: #0f0d0e;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #ff6b6b;
        }

        .status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d3f9d8;
            color: #2f9e44;
            border: 1px solid #51cf66;
            display: block;
        }

        .status-message.error {
            background: #ffe0e0;
            color: #c92a2a;
            border: 1px solid #ff8787;
            display: block;
        }

        .file-preview {
            margin-top: 12px;
            padding: 12px 14px;
            border: 1px dashed #0f0d0e;
            border-radius: 6px;
            background: #f9f9f9;
            color: #0f0d0e;
            font-size: 13px;
        }

        .image-preview {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px dashed #ddd;
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .image-preview-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .file-selected {
            font-size: 13px;
            color: #2f9e44;
            font-weight: 600;
            margin-top: 8px;
            display: none;
        }

        .file-selected.active {
            display: block;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .cms-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .cms-buttons {
                width: 100%;
            }

            .item-card {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
            }

        }
    </style>
</head>
<body>
    <div class="cms-container">
        <!-- Header -->
        <div class="cms-header">
            <h1>Portfolio CMS</h1>
            <div class="cms-buttons">
                <button class="btn btn-secondary" onclick="viewPortfolio()">
                    <i class="fas fa-eye"></i> View Portfolio
                </button>
                <button class="btn btn-success" onclick="saveData()">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('profile')">Profile</button>
            <button class="tab-btn" onclick="switchTab('social')">Social Links</button>
            <button class="tab-btn" onclick="switchTab('projects')">Projects</button>
            <button class="tab-btn" onclick="switchTab('education')">Education</button>
            <button class="tab-btn" onclick="switchTab('achievements')">Achievements</button>
        </div>

        <!-- Profile Tab -->
        <div class="tab-content active" id="profile">
            <div class="form-section">
                <h3>Profile Information</h3>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profileName" placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Title/Profession</label>
                    <input type="text" id="profileTitle" placeholder="e.g., UI/UX Designer">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Year</label>
                        <input type="text" id="profileYear" placeholder="2025">
                    </div>
                    <div class="form-group">
                        <label>CV File</label>
                        <input type="file" id="profileCVInput" accept=".pdf,.doc,.docx,application/pdf">
                        <div id="profileCVPreview" class="file-preview">No CV selected</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="profileBio" placeholder="Write a short bio about yourself"></textarea>
                </div>
                <div class="form-group">
                    <label>Profile Image</label>
                    <input type="file" id="profileImageInput" accept="image/*" onchange="handleImageUpload('profileImage', 'profileImagePreview')">
                    <div id="profileImagePreview" class="image-preview" style="display: none;">
                        <img id="profileImageImg" src="" alt="Preview">
                        <div class="image-preview-text" id="profileImageName"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Social Links Tab -->
        <div class="tab-content" id="social">
            <div class="form-section">
                <h3>Social Media Links</h3>
                <div class="form-group">
                    <label>LinkedIn URL</label>
                    <input type="url" id="socialLinkedin" placeholder="https://linkedin.com/in/yourprofile">
                </div>
                <div class="form-group">
                    <label>GitHub URL</label>
                    <input type="url" id="socialGithub" placeholder="https://github.com/yourprofile">
                </div>
                <div class="form-group">
                    <label>Facebook URL</label>
                    <input type="url" id="socialFacebook" placeholder="https://facebook.com/yourprofile">
                </div>
                <div class="form-group">
                    <label>Instagram URL</label>
                    <input type="url" id="socialInstagram" placeholder="https://instagram.com/yourprofile">
                </div>
            </div>
        </div>

        <!-- Projects Tab -->
        <div class="tab-content" id="projects">
            <div class="form-section">
                <h3>Your Projects</h3>
                <div class="items-list" id="projectsList"></div>
                <button class="btn btn-secondary add-new-btn" onclick="openProjectModal()">
                    <i class="fas fa-plus"></i> Add New Project
                </button>
            </div>
        </div>

        <!-- Education Tab -->
        <div class="tab-content" id="education">
            <div class="form-section">
                <h3>Education</h3>
                <div class="items-list" id="educationList"></div>
                <button class="btn btn-secondary add-new-btn" onclick="openEducationModal()">
                    <i class="fas fa-plus"></i> Add Education
                </button>
            </div>
        </div>

        <!-- Achievements Tab -->
        <div class="tab-content" id="achievements">
            <div class="form-section">
                <h3>Notable Achievements</h3>
                <div class="items-list" id="achievementsList"></div>
                <button class="btn btn-secondary add-new-btn" onclick="openAchievementModal()">
                    <i class="fas fa-plus"></i> Add Achievement
                </button>
            </div>
        </div>
    </div>

    <!-- Project Modal -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Project</h2>
                <button class="modal-close" onclick="closeModal('projectModal')">×</button>
            </div>
            <div class="form-group">
                <label>Project Title</label>
                <input type="text" id="projectTitle" placeholder="Project name">
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="projectCategory" placeholder="e.g., UI/UX DESIGN, WEBSITE, FREELANCE PROJECT">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="projectDesc" placeholder="Project description"></textarea>
            </div>
            <div class="form-group">
                <label>Project Image</label>
                <input type="file" id="projectImageInput" accept="image/*" onchange="handleImageUpload('projectImage', 'projectImagePreview')">
                <div id="projectImagePreview" class="image-preview" style="display: none;">
                    <img id="projectImageImg" src="" alt="Preview">
                    <div class="image-preview-text" id="projectImageName"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Project Link</label>
                <input type="url" id="projectLink" placeholder="https://example.com">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveProject()">Save</button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal('projectModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Education Modal -->
    <div class="modal" id="educationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Education</h2>
                <button class="modal-close" onclick="closeModal('educationModal')">×</button>
            </div>
            <div class="form-group">
                <label>School/University</label>
                <input type="text" id="eduSchool" placeholder="School name">
            </div>
            <div class="form-group">
                <label>Degree</label>
                <input type="text" id="eduDegree" placeholder="e.g., Bachelor of Science in Information Technology">
            </div>
            <div class="form-group">
                <label>Year/Duration</label>
                <input type="text" id="eduYear" placeholder="2023 – Present">
            </div>
            <div class="form-group">
                <label>Details (GWA, Honors, etc.)</label>
                <input type="text" id="eduDesc" placeholder="e.g., Dean's Lister, GWA: 94">
            </div>
            <div class="form-group">
                <label>Logo/Image</label>
                <input type="file" id="eduImageInput" accept="image/*" onchange="handleImageUpload('eduImage', 'eduImagePreview')">
                <div id="eduImagePreview" class="image-preview" style="display: none;">
                    <img id="eduImageImg" src="" alt="Preview">
                    <div class="image-preview-text" id="eduImageName"></div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveEducation()">Save</button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal('educationModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Achievement Modal -->
    <div class="modal" id="achievementModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Achievement</h2>
                <button class="modal-close" onclick="closeModal('achievementModal')">×</button>
            </div>
            <div class="form-group">
                <label>Achievement Title</label>
                <input type="text" id="achievementTitle" placeholder="Title">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="achievementDesc" placeholder="Achievement details"></textarea>
            </div>
            <div class="form-group">
                <label>Achievement Image</label>
                <input type="file" id="achievementImageInput" accept="image/*" onchange="handleImageUpload('achievementImage', 'achievementImagePreview')">
                <div id="achievementImagePreview" class="image-preview" style="display: none;">
                    <img id="achievementImageImg" src="" alt="Preview">
                    <div class="image-preview-text" id="achievementImageName"></div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveAchievement()">Save</button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal('achievementModal')">Cancel</button>
            </div>
        </div>
    </div>

    <script src="cms.js"></script>
</body>
</html>
